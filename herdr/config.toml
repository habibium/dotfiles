# Shared by every machine. Only this file is tracked; logs, sockets, session
# and plugin state stay in ~/.config/herdr.
onboarding = false

[keys]
prefix = "ctrl+a"
detach = "prefix+d"
reload_config = "prefix+r"
resize_mode = "prefix+shift+r"
previous_tab = "prefix+ctrl+h"
next_tab = "prefix+ctrl+l"
rename_tab = "prefix+comma"
close_tab = "prefix+ampersand"
close_workspace = "prefix+shift+x"
workspace_picker = "prefix+s"
settings = "prefix+shift+s"
copy_mode = "prefix+enter"
previous_workspace = "prefix+("
next_workspace = "prefix+)"
previous_agent = "prefix+p"
next_agent = "prefix+n"
zoom = "prefix+shift+="
switch_workspace = "prefix+shift+1..9"
focus_agent = "prefix+alt+1..9"
goto = "prefix+t"

new_tab = "prefix+c"
new_workspace = "prefix+ctrl+c"
split_vertical = "prefix+shift+minus"
split_horizontal = "prefix+minus"

[ui]
mouse_scroll_lines = 1
prompt_new_tab_name = false
pane_gaps = false
prompt_new_workspace_name = true

[ui.toast]
# system = terminal-notifier; click activates Ghostty, then prefix+o jumps to the pane.
# Covers agents on connected machines too, which a server-side plugin cannot.
delivery = "system"

[ui.sound]
enabled = true

[theme]
name = "terminal"
auto_switch = false
